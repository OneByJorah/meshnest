name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: ./packaging/build-deb.sh "${GITHUB_REF_NAME#v}"
      - name: checksums
        run: cd dist && sha256sum ./*.deb > SHA256SUMS
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.deb dist/SHA256SUMS --generate-notes
